    <main>
        <h2>Welcome Back!</h2>
        <p>Log in to access your job applications.</p>

        <form>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <br><br>

            <button type="submit">Login</button>
        </form>
